<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin — Love Stories Moderation</title>
  <link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    .admin-login { max-width:400px; margin:100px auto; padding:40px; background:var(--card-bg); border-radius:16px; box-shadow:0 4px 25px var(--shadow); border:1px solid var(--border); text-align:center; }
    .admin-login h1 { font-family:var(--font-serif); color:var(--primary); margin-bottom:20px; }
    .admin-login input { width:100%; padding:14px 16px; border:2px solid var(--border); border-radius:10px; font-size:1rem; margin-bottom:15px; outline:none; }
    .admin-login input:focus { border-color:var(--primary); }
    .admin-panel { display:none; }
    .admin-panel.active { display:block; }
    .admin-header { display:flex; justify-content:space-between; align-items:center; padding:20px 0; flex-wrap:wrap; gap:15px; }
    .admin-header h1 { font-family:var(--font-serif); color:var(--primary); }
    .admin-header .logout { cursor:pointer; color:var(--primary); text-decoration:underline; }
    .admin-stats { display:flex; gap:20px; margin-bottom:30px; flex-wrap:wrap; }
    .stat-card { flex:1; min-width:120px; background:var(--card-bg); padding:20px; border-radius:12px; box-shadow:0 2px 15px var(--shadow); border:1px solid var(--border); text-align:center; }
    .stat-card .num { font-size:2rem; font-weight:700; color:var(--primary); }
    .stat-card .label { font-size:0.85rem; color:var(--text-light); margin-top:5px; }
    .admin-story { background:var(--card-bg); border-radius:12px; padding:25px; margin-bottom:20px; border:1px solid var(--border); box-shadow:0 2px 15px var(--shadow); }
    .admin-story.meta { font-size:0.85rem; color:var(--text-light); margin-bottom:10px; }
    .admin-story h3 { font-family:var(--font-serif); color:var(--primary); margin-bottom:5px; }
    .admin-story .content { line-height:1.8; margin:15px 0; padding:15px; background:var(--bg); border-radius:8px; }
    .admin-story .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:15px; }
    .admin-story .actions button { padding:10px 24px; border:none; border-radius:8px; cursor:pointer; font-weight:600; font-size:0.9rem; transition:all 0.3s ease; }
    .btn-approve { background:#27ae60; color:#fff; }
    .btn-approve:hover { background:#219a52; }
    .btn-reject { background:#e74c3c; color:#fff; }
    .btn-reject:hover { background:#c0392b; }
    .btn-email { background:#3498db; color:#fff; font-size:0.75rem !important; padding:8px 16px !important; }
    .btn-email:hover { background:#2980b9; }
    .badge { display:inline-block; padding:3px 10px; border-radius:12px; font-size:0.75rem; font-weight:600; }
    .badge-pending { background:#f39c12; color:#fff; }
    .badge-approved { background:#27ae60; color:#fff; }
    .badge-rejected { background:#95a5a6; color:#fff; }
    .tabs { display:flex; gap:10px; margin-bottom:25px; flex-wrap:wrap; }
    .tabs button { padding:10px 24px; border:2px solid var(--border); background:var(--card-bg); border-radius:8px; cursor:pointer; font-weight:600; transition:all 0.3s ease; color:var(--text); }
    .tabs button.active { border-color:var(--primary); color:var(--primary); background:var(--bg-alt); }
    .empty-state { text-align:center; padding:60px; color:var(--text-light); }
    .loading { text-align:center; padding:60px; color:var(--text-light); }
    .error-msg { text-align:center; padding:20px; color:#e74c3c; }
  </style>
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<noscript><div class="noscript-banner">JavaScript is not enabled. Some features like theme switching and translations may not work.</div></noscript>
  <div class="container" id="main" role="main">
    <!-- Login -->
    <div id="loginSection" class="admin-login">
      <h1>&#128274; Admin Login</h1>
      <input type="password" id="adminTokenInput" placeholder="Enter admin token" autocomplete="off">
      <button class="submit-btn" onclick="login()">Login</button>
      <p id="loginError" style="color:#e74c3c;margin-top:10px;display:none;"></p>
    </div>

    <!-- Admin Panel -->
    <div id="adminPanel" class="admin-panel">
      <div class="admin-header">
        <h1>&#10084; Love Stories — Moderation</h1>
        <div>
          <span id="serverStatus" style="font-size:0.85rem;color:var(--text-light);margin-right:15px;"></span>
          <span class="logout" onclick="logout()">Logout</span>
        </div>
      </div>

      <div class="admin-stats" id="statsContainer">
        <div class="stat-card"><div class="num" id="statTotal">0</div><div class="label">Total</div></div>
        <div class="stat-card"><div class="num" id="statPending">0</div><div class="label">Pending</div></div>
        <div class="stat-card"><div class="num" id="statApproved">0</div><div class="label">Approved</div></div>
        <div class="stat-card"><div class="num" id="statRejected">0</div><div class="label">Rejected</div></div>
      </div>

      <div class="tabs">
        <button class="active" onclick="switchTab('stories', event)">Stories</button>
        <button onclick="switchTab('contacts', event)">Contact Messages</button>
      </div>
      <div class="tabs" id="storyFilters">
        <button class="active" onclick="filterStories('all', event)">All</button>
        <button onclick="filterStories('pending', event)">Pending</button>
        <button onclick="filterStories('approved', event)">Approved</button>
        <button onclick="filterStories('rejected', event)">Rejected</button>
      </div>

      <div id="storiesList">
        <div class="loading">Loading stories...</div>
      </div>
      <div id="contactsList" style="display:none;">
        <div class="loading">Loading contacts...</div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;
    let token = '';
    let allStories = [];
    let currentFilter = 'all';

    function login() {
      token = document.getElementById('adminTokenInput').value.trim();
      if (!token) return;
      document.getElementById('loginError').style.display = 'none';
      try { sessionStorage.setItem('adminToken', token); } catch(e) { console.warn('Cannot save token to sessionStorage:', e.message); }
      fetchStories();
    }

    function logout() {
      token = '';
      allStories = [];
      document.getElementById('loginSection').style.display = 'block';
      document.getElementById('adminPanel').classList.remove('active');
      document.getElementById('adminTokenInput').value = '';
      try { sessionStorage.removeItem('adminToken'); } catch(e) { console.warn('Cannot remove token from sessionStorage:', e.message); }
      window.location.hash = '';
    }

    // Restore token from sessionStorage only (not URL hash — security risk)
    try { token = sessionStorage.getItem('adminToken') || ''; } catch(e) { console.warn('Cannot read token from sessionStorage:', e.message); }
    if (token) {
      document.getElementById('adminTokenInput').value = token;
    }

    async function fetchStories() {
      document.getElementById('storiesList').innerHTML = '<div class="loading">Loading stories...</div>';
      document.getElementById('serverStatus').textContent = 'Connecting...';

      try {
        const res = await fetch(`${API_BASE}/api/admin/stories`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!res.ok) {
          if (res.status === 401) {
            document.getElementById('loginError').textContent = 'Invalid token. Try again.';
            document.getElementById('loginError').style.display = 'block';
            return;
          }
          throw new Error('Server error: ' + res.status);
        }

        allStories = await res.json();
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('adminPanel').classList.add('active');
        document.getElementById('serverStatus').textContent = 'Connected';
        renderStories();
      } catch (err) {
        document.getElementById('storiesList').innerHTML =
          `<div class="error-msg">Cannot connect to server. Is the Worker deployed?<br><small>${err.message}</small></div>`;
        document.getElementById('serverStatus').textContent = 'Offline';
      }
    }

    function renderStories() {
      const total = allStories.length;
      const pending = allStories.filter(s => s.status === 'pending').length;
      const approved = allStories.filter(s => s.status === 'approved').length;
      const rejected = allStories.filter(s => s.status === 'rejected').length;

      document.getElementById('statTotal').textContent = total;
      document.getElementById('statPending').textContent = pending;
      document.getElementById('statApproved').textContent = approved;
      document.getElementById('statRejected').textContent = rejected;

      let filtered = allStories;
      if (currentFilter !== 'all') {
        filtered = allStories.filter(s => s.status === currentFilter);
      }

      const container = document.getElementById('storiesList');

      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-state">No stories in this category.</div>';
        return;
      }

      container.innerHTML = filtered.map(s => {
        const date = new Date(s.date).toLocaleString();
        const badgeClass = `badge-${s.status}`;
        return `
          <div class="admin-story" data-id="${s.id}">
            <div class="meta">
              <span class="badge ${badgeClass}">${s.status}</span>
              &mdash; ${s.name} &mdash; ${date} &mdash; <strong>${s.lang}</strong>
              ${s.email ? `&mdash; <a href="mailto:${escapeHtml(s.email)}">${escapeHtml(s.email)}</a>` : ''}
            </div>
            <h3>${escapeHtml(s.title)}</h3>
            <div class="content">${escapeHtml(s.content)}</div>
            <div class="actions">
              ${s.status !== 'approved' ? `<button class="btn-approve" onclick="approveStory('${s.id}')">&#10003; Approve</button>` : ''}
              ${s.status !== 'rejected' ? `<button class="btn-reject" onclick="rejectStory('${s.id}')">&#10007; Reject</button>` : ''}
              <button class="btn-email" onclick="copyEmail('${s.id}')">&#128231; Copy Email URL</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterStories(filter, evt) {
      currentFilter = filter;
      document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
      if (evt && evt.target) evt.target.classList.add('active');
      renderStories();
    }

    function switchTab(tab, evt) {
      document.querySelectorAll('.tabs:first-child button').forEach(b => b.classList.remove('active'));
      if (evt && evt.target) evt.target.classList.add('active');
      if (tab === 'stories') {
        document.getElementById('storyFilters').style.display = '';
        document.getElementById('storiesList').style.display = '';
        document.getElementById('contactsList').style.display = 'none';
        renderStories();
      } else {
        document.getElementById('storyFilters').style.display = 'none';
        document.getElementById('storiesList').style.display = 'none';
        document.getElementById('contactsList').style.display = '';
        fetchContacts();
      }
    }

    async function fetchContacts() {
      const container = document.getElementById('contactsList');
      container.innerHTML = '<div class="loading">Loading contact messages...</div>';
      try {
        const res = await fetch(`${API_BASE}/api/admin/contacts`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) throw new Error('Failed to load');
        const msgs = await res.json();
        if (msgs.length === 0) {
          container.innerHTML = '<div class="empty-state">No contact messages yet.</div>';
          return;
        }
        container.innerHTML = msgs.map(m => `
          <div class="admin-story">
            <div class="meta">${escapeHtml(m.name)} &mdash; ${new Date(m.date).toLocaleString()} ${m.email ? `&mdash; <a href="mailto:${escapeHtml(m.email)}">${escapeHtml(m.email)}</a>` : ''}</div>
            <h3>${escapeHtml(m.subject)}</h3>
            <div class="content">${escapeHtml(m.message)}</div>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = `<div class="error-msg">Failed to load contacts: ${err.message}</div>`;
      }
    }

    async function approveStory(id) {
      try {
        const res = await fetch(`${API_BASE}/api/admin/stories`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ id, action: 'approve' })
        });
        if (!res.ok) throw new Error('Failed to approve');
        await fetchStories();
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }

    async function rejectStory(id) {
      try {
        const res = await fetch(`${API_BASE}/api/admin/stories`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ id, action: 'reject' })
        });
        if (!res.ok) throw new Error('Failed to reject');
        await fetchStories();
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }

    async function copyEmail(id) {
      const story = allStories.find(s => s.id === id);
      if (!story) return;
      try {
        const res = await fetch(`${API_BASE}/api/admin/stories/${id}/onetimetoken`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) throw new Error('Failed to generate tokens');
        const data = await res.json();
        const text = `To review: "${story.title}"\n\nApprove: ${data.approveUrl}\nReject: ${data.rejectUrl}`;
        await navigator.clipboard.writeText(text);
        alert('One-time URLs copied to clipboard!');
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }

    function escapeHtml(text) {
      const d = document.createElement('div');
      d.textContent = text;
      return d.innerHTML;
    }

    // Auto-login if hash is present
    if (token) fetchStories();
  </script>
</body>
</html>
